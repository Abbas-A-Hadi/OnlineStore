<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Login & Register</title>
    <link rel="stylesheet" href="../style/login-page.css"/>
    <script type="module" src="../.././WebSite-Root/script/dist/LoginPage/login-page.js" defer></script>
</head>
<body>
<div class="container">
    <div class="form-box">

        <!-- LOGIN FORM -->
        <form id="loginForm" class="form active">
            <h2 class="neon-text">Login</h2>

            <div class="input-group">
                <input type="email" placeholder=" " required />
                <label>Email</label>
            </div>

            <div class="input-group">
                <input type="password" placeholder=" " required />
                <label>Password</label>
            </div>

            <button type="submit" class="btn">Login</button>
            <p class="switch">
                Don't have an account? <a href="#" id="showRegister">Register</a>
            </p>
        </form>

        <!-- REGISTER STEP 1 -->
        <form id="registerStep1" class="form">
            <h2 class="neon-text">Register</h2>

            <div class="input-group">
                <input type="email" id="regEmail" placeholder=" " required />
                <label>Email</label>
            </div>

            <div class="input-group">
                <input type="password" id="regPassword" placeholder=" " required />
                <label>Password</label>
            </div>

            <div class="input-group">
                <input type="password" id="regConfirm" placeholder=" " required />
                <label>Confirm Password</label>
            </div>

            <button type="button" class="btn" id="nextStep">Next</button>
            <p class="switch">
                Already have an account? <a href="#" id="showLoginFromReg">Login</a>
            </p>
        </form>

        <!-- REGISTER STEP 2 -->
        <form id="registerStep2" class="form">
            <h2 class="neon-text">Personal Info</h2>

            <div class="input-group">
                <input type="text" id="regUsername" placeholder=" " required />
                <label>Username</label>
            </div>

            <div class="input-group">
                <input type="text" id="regFirstName" placeholder=" " required />
                <label>First Name</label>
            </div>

            <div class="input-group">
                <input type="text" id="regLastName" placeholder=" " required />
                <label>Last Name</label>
            </div>

            <div class="input-group">
                <input type="text" id="regBirthday" placeholder="dd/mm/yyyy" required maxlength="10" />
                <label class="label-date">Birthday</label>
            </div>

            <button type="submit" class="btn">Register</button>
            <p class="switch">
                Already have an account? <a href="#" id="showLoginFromStep2">Login</a>
            </p>
        </form>

    </div>
</div>
</body>
</html>
