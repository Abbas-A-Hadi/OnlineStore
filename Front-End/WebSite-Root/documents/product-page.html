<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha Shop | Product Details</title>
  <link rel="stylesheet" href="../style/product-page.css">
  <script type="module" src="../.././WebSite-Root/script/dist/ProductPage/product-page.js" defer></script>
</head>

<body>

  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <div class="logo">ALPHA<span>SHOP</span></div>
        <div class="tag">Cyber Deals</div>
      </div>
  
      <nav class="main-nav">
        <a href="./home-page.html">Home</a>
        <a href="./home-page.html#products">Products</a>
        <a href="./home-page.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="product-page">
    <section class="container product-layout">
      <div class="gallery">
        <div class="thumbs" id="thumbs"></div>
        <div class="main-image">
          <img id="product-image" src="" alt="">
        </div>
      </div>
  
      <div class="product-main">
        <h1 id="product-name"></h1>
        <p class="sku" id="product-sku"></p>
  
        <div class="rating-row">
          <div class="stars">★★★★★</div>
          <span class="reviews" id="product-reviews"></span>
        </div>
  
        <div class="price-block">
          <span class="price-label">Price:</span>
          <span class="price-value" id="product-price"></span>
        </div>
  
        <p class="short-desc" id="product-short"></p>
  
        <ul class="feature-list" id="product-features"></ul>
      </div>
  
      <aside class="buy-box">
        <div class="buy-price" id="buy-price"></div>
        <div class="stock" id="product-stock"></div>
        <button class="primary-btn" onclick="addToCartFromDetails()">Add to Cart</button>
        <button class="ghost-btn" onclick="buyNow()">Buy Now</button>
        <p class="ship-text">Neon fast shipping • Secure checkout</p>
      </aside>
    </section>
  
    <section class="container details-section">
      <h2>Product Details</h2>
      <p id="product-long"></p>
    </section>
  
    <section class="container related-section">
      <div class="section-head">
        <h2>Related Products</h2>
      </div>
      <div class="related-grid" id="related-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>&copy 2025 Alpha Shop</div>
      <div class="socials">Follow: <span>Twitter • Instagram • Discord</span></div>
    </div>
  </footer>

</body>
</html>
