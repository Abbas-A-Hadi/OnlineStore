<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Payment | alpha shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="ST_payment.css" />
</head>
<body>

<div class="bg-grid"></div>

<header class="checkout-header">
    <div class="header-left">
        <div class="logo" onclick="goHome()">alpha shop</div>
        <div class="steps">
            <span class="step done">Cart</span>
            <span class="step done">Details</span>
            <span class="step active">Payment</span>
            <span class="step">Review</span>
        </div>
    </div>
</header>

<main class="checkout-wrapper">
    <section class="checkout-left">
        <div class="card neon-card">
            <h2>Contact information</h2>
            <div class="field-row">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="you@example.com" required />
            </div>
            <div class="field-row">
                <label for="phone">Phone</label>
                <input id="phone" type="tel" placeholder="+964 xxx xxx xxx" required />
            </div>
        </div>

        <div class="card neon-card">
            <h2>Shipping address</h2>
            <div class="field-row two-col">
                <div>
                    <label for="first-name">First name</label>
                    <input id="first-name" type="text" placeholder="First name" required />
                </div>
                <div>
                    <label for="last-name">Last name</label>
                    <input id="last-name" type="text" placeholder="Last name" required />
                </div>
            </div>

            <div class="field-row">
                <label for="address">Address</label>
                <input id="address" type="text" placeholder="Street and number" required />
            </div>

            <div class="field-row two-col">
                <div>
                    <label for="city">City</label>
                    <input id="city" type="text" placeholder="Baghdad, Erbil, ..." required />
                </div>
                <div>
                    <label for="zip">ZIP / Postal code</label>
                    <input id="zip" type="text" placeholder="00000" />
                </div>
            </div>

            <div class="field-row">
                <label for="country">Country</label>
                <select id="country">
                    <option value="Iraq" selected>Iraq</option>
                    <option value="KSA">Saudi Arabia</option>
                    <option value="UAE">UAE</option>
                    <option value="USA">USA</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <div class="card neon-card">
            <h2>Payment method</h2>

            <div class="payment-methods">
                <label class="radio-row">
                    <input type="radio" name="payment" value="card" checked />
                    <div class="radio-body">
                        <div class="radio-title">Credit / Debit card</div>
                        <div class="radio-sub">Visa, MasterCard, etc.</div>
                    </div>
                    <div class="card-icons">💳</div>
                </label>

                <label class="radio-row">
                    <input type="radio" name="payment" value="cod" />
                    <div class="radio-body">
                        <div class="radio-title">Cash on delivery</div>
                        <div class="radio-sub">Pay when your order arrives</div>
                    </div>
                    <div class="card-icons">💵</div>
                </label>
            </div>

            <div id="card-details" class="card-details">
                <div class="field-row">
                    <label for="card-number">Card number</label>
                    <input id="card-number" type="text" placeholder="XXXX XXXX XXXX XXXX" />
                </div>

                <div class="field-row two-col">
                    <div>
                        <label for="card-exp">Expiry date</label>
                        <input id="card-exp" type="text" placeholder="MM/YY" />
                    </div>
                    <div>
                        <label for="card-cvv">CVV</label>
                        <input id="card-cvv" type="password" maxlength="4" placeholder="***" />
                    </div>
                </div>

                <div class="field-row">
                    <label for="card-name">Name on card</label>
                    <input id="card-name" type="text" placeholder="Cardholder name" />
                </div>
            </div>
        </div>

        <div class="card neon-card sticky-actions">
            <button id="pay-btn" class="primary-btn">
                Complete Order
            </button>
            <p class="terms">
                By placing your order you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
            </p>
        </div>
    </section>

    <aside class="checkout-right">
        <div class="card neon-card order-card">
            <h2>Order summary</h2>

            <div id="order-items" class="order-items"></div>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal-amount">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span id="shipping-amount">$0.00</span>
            </div>
            <div class="summary-row total-row">
                <span>Total</span>
                <span id="total-amount">$0.00</span>
            </div>

            <div class="coupon-row">
                <input id="coupon-input" type="text" placeholder="Coupon code" />
                <button id="apply-coupon-btn" class="secondary-btn">Apply</button>
            </div>
        </div>
    </aside>
</main>

<div id="toast" class="toast hidden">
    <span id="toast-message"></span>
</div>

<script src="JS_payment.js"></script>
</body>
</html>
